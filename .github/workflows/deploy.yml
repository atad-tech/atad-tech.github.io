name: Test & deploy

# كل push بيتبني ويتختبر بالكامل. النشر بيحصل بس لو كل الاختبارات نجحت.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# مفيش أي صلاحيات افتراضية. كل job بياخد اللي محتاجه بس.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-24.04 # ثابت عشان البناء يبقى قابل للتكرار
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # --ignore-scripts: ما نشغّلش أي كود تثبيت من الباكدجات (حماية من هجمات سلسلة التوريد)
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Type-check & build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04 # ثابت عشان البناء يبقى قابل للتكرار
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # بيبلّغ Bing وYandex وباقي محركات IndexNow إن الصفحات اتحدثت، فبيأرشفوها أسرع.
      # لو فشل مايوقفش النشر.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          SITE: https://atad-tech.github.io
          INDEXNOW_KEY: "ab1a968aede6c990cc1d2d0ee3e26ecd"
        run: |
          sleep 20
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          body=$(jq -nc --argjson u "$urls" --arg k "$INDEXNOW_KEY" '{host:"atad-tech.github.io",key:$k,keyLocation:("https://atad-tech.github.io/"+$k+".txt"),urlList:$u}')
          curl -fsS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
