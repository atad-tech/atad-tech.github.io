name: CodeQL security scan

# فحص أمني تلقائي للكود (JavaScript/TypeScript وملفات الـ workflows) مع كل تعديل، ومرة كل أسبوع.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04 # ثابت عشان البناء يبقى قابل للتكرار
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          category: "/language:${{ matrix.language }}"
