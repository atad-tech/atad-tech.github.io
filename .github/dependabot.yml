# Dependabot بيفتح Pull Request لوحده لما يطلع تحديث أمني لأي باكدج أو GitHub Action.
# كل PR بيعدّي على نفس الاختبارات قبل ما يتدمج.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-tools:
        dependency-type: development
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    labels: ["dependencies", "ci"]
